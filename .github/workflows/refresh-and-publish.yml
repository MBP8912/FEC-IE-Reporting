name: 2026 IE reporting - nine districts

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ie-nine-district-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test election scope, nine-race mapping, classifications and duplicate removal
        run: python -m unittest discover -s tests -v
      - name: Check shared dashboard and notice-only 48-hour UI
        run: |
          node --check assets/app.js
          node --check assets/recent48.js
          node --test tests/test_recent48_ui.cjs
      - name: Apply race-specific categories to verified historical expenditures
        run: python scripts/reclassify_cached.py
      - name: Refresh complete WI-1 dataset first, before FEC rate limits affect later districts
        id: wi1_priority
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/refresh_priority_wi.py
      - name: Explain WI-1 priority refresh interruptions
        if: steps.wi1_priority.outcome != 'success'
        run: echo "WI-1 full FEC scan unavailable; retaining the last verified WI-1 totals."
      - name: Refresh complete NE-2 dataset before the shared FEC rate budget
        id: ne2_priority
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/refresh_priority_ne.py
      - name: Explain NE-2 priority refresh interruptions
        if: steps.ne2_priority.outcome != 'success'
        run: echo "NE-2 full FEC scan unavailable; retaining the last verified NE-2 totals."
      - name: Refresh notice-only 48-hour receipt timestamps for all nine races
        id: all_recent48
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/update_recent_all.py
      - name: Explain 48-hour receipt refresh interruptions
        if: steps.all_recent48.outcome != 'success'
        run: echo "FEC receipt metadata temporarily unavailable. Previously verified or explicitly pending recent reports remain unchanged."
      - name: Fetch all unique general-election IE transactions, resuming saved cursor
        id: refresh
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          WI1_PRIORITY_OK: ${{ steps.wi1_priority.outcome == 'success' }}
          NE2_PRIORITY_OK: ${{ steps.ne2_priority.outcome == 'success' }}
        run: python scripts/refresh_all.py
      - name: Rebuild 48-hour notice feeds from the just-refreshed full-cycle data
        id: post_refresh_recent48
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/update_recent_all.py
      - name: Explain post-refresh receipt lookup interruptions
        if: steps.post_refresh_recent48.outcome != 'success'
        run: echo "The post-refresh 48-hour notice feed was not rebuilt; live validation will prevent publishing mismatched timestamps."
      - name: Explain FEC API failure
        if: steps.refresh.outcome != 'success'
        run: echo "FEC source unavailable. Previously verified race snapshots remain intact."
      - name: Package all nine individual dashboards
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp assets/* _site/assets/
          for race in NY-17 CO-4 CO-5 IA-1 MN-1 NE-2 WI-1 NY-19 CA-13; do
            mkdir -p "_site/$race/data"
            cp "$race/index.html" "_site/$race/"
            cp "$race/data/data.json" "_site/$race/data/"
            cp "$race/data/recent48.json" "_site/$race/data/"
          done
          touch _site/.nojekyll
      - name: Save verified snapshots and resumption checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ie-all-district-data
          path: |
            NY-17/data/data.json
            NY-17/data/recent48.json
            CO-4/data/recent48.json
            CO-5/data/recent48.json
            IA-1/data/recent48.json
            MN-1/data/recent48.json
            NE-2/data/recent48.json
            WI-1/data/recent48.json
            NY-19/data/recent48.json
            CA-13/data/recent48.json
            CO-4/data/data.json
            CO-5/data/data.json
            IA-1/data/data.json
            MN-1/data/data.json
            NE-2/data/data.json
            WI-1/data/data.json
            NY-19/data/data.json
            CA-13/data/data.json
            data/ingest_checkpoint.json
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Verify live root redirect and nine separate dashboards
        run: python scripts/verify_site.py

  archive:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: ie-all-district-data
          path: .
      - name: Archive candidate-specific FEC snapshots and resumption cursor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A NY-17/data CO-4/data CO-5/data IA-1/data MN-1/data NE-2/data WI-1/data NY-19/data CA-13/data data/ingest_checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Schedule E reports and cursor [skip ci]'
            git pull --rebase -X theirs origin main
            git push
          fi
