name: Refresh NY-17 independent expenditure dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ie-ny17-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deduplication, general-election filters and category normalization
        run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript syntax
        run: node --check assets/app.js
      - name: Refresh all unique 2026 general-election Schedule E expenditures
        id: refresh
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/refresh.py
      - name: Archive FEC-derived expenditure dataset
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NY-17 independent expenditures [skip ci]'
            git pull --rebase -X theirs origin main
            git push
          fi
      - name: Report refresh issue without destroying archived values
        if: steps.refresh.outcome != 'success'
        run: echo "FEC API refresh failed. Reusing the last verified data; inspect refresh logs."
      - name: Assemble GitHub Pages
        run: |
          mkdir -p _site/data _site/assets
          cp index.html _site/
          cp assets/* _site/assets/
          cp data/data.json _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish independent expenditure dashboard
        id: deployment
        uses: actions/deploy-pages@v4
