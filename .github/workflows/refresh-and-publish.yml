name: NY-17 independent expenditures - refresh and publish

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ny17-ie-pages-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test election filtering, deduplication and categories
        run: python -m unittest discover -s tests -v
      - name: Check dashboard script syntax
        run: node --check assets/app.js
      - name: Refresh unique general-election Schedule E transactions
        id: refresh
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/refresh.py
      - name: Explain FEC data failures
        if: steps.refresh.outcome != 'success'
        run: echo "FEC refresh failed. Deploying last previously verified data file, without inventing amounts."
      - name: Assemble district directory and standalone NY-17 dashboard
        run: |
          mkdir -p _site/NY-17/data _site/assets
          cp index.html _site/
          cp NY-17/index.html _site/NY-17/
          cp assets/* _site/assets/
          cp NY-17/data/data.json _site/NY-17/data/data.json
          touch _site/.nojekyll
      - name: Save verified dataset artifact for independent archiving
        if: steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ie-verified-data
          path: NY-17/data/data.json
          retention-days: 5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check out source for site verification
        uses: actions/checkout@v4
      - name: Verify the public page, browser assets and FEC dataset
        run: python scripts/verify_site.py

  archive:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Check out code and previous verified dataset
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download updated verified dataset
        uses: actions/download-artifact@v4
        with:
          name: ie-verified-data
          path: NY-17/data
      - name: Commit and archive refreshed FEC data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NY-17/data/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Archive unique NY-17 IE transactions [skip ci]'
            git pull --rebase -X theirs origin main
            git push
          fi
